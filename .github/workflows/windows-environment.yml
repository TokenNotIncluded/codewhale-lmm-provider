name: Windows environment isolation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: windows-environment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  environment:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/child-environment.test.mjs
