name: Validate Codewhale upgrade
on:
  push:
    branches: [chore/plugin-compat-20261006]
    paths: [.github/workflows/compatibility-upgrade.yml, test/native-host.mjs]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.ref == 'refs/heads/chore/plugin-compat-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/plugin-compat-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply compatibility changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert old in text, (path, old)
              p.write_text(text.replace(old, new))
          for path in ['package.json', 'plugin.json', 'README.md']:
              replace(path, '0.1.0-alpha.1', '0.1.0-alpha.2')
          replace('package.json', '"test": "node --test test/*.test.mjs",', '"test": "node --test test/*.test.mjs",\n    "test:host": "node --test test/native-host.mjs",')
          replace('src/provider.mjs', 'PROVIDER|HTTP_HEADERS|CONFIG_PATH|CONFIG_FILE)', 'PROVIDER|PROFILE|HTTP_HEADERS|CONFIG_PATH|CONFIG_FILE)')
          replace('src/cli.mjs', 'api-key|config|config-path)', 'api-key|config|config-path|profile)')
          replace('src/cli.mjs', 'provider/model/credentials/config after', 'provider/model/credentials/config/profile after')
          replace('README.md', '依据 Codewhale `b367f6248715510cb5d527e57e4e352db14cb0cd`', '依据 Codewhale 0.10.1 开发源码 `ecbf2869ab9110486a9e1d6d75481d1d7adf8acf`，并使用 npm 当前稳定版进行原生目录测试')
          replace('README.md', 'Hmbown/Codewhale/blob/b367f6248715510cb5d527e57e4e352db14cb0cd', 'codewhale-hq/Codewhale/blob/ecbf2869ab9110486a9e1d6d75481d1d7adf8acf')
          replace('README.md', '适配器不重试模型 POST；', '会清除子进程中的 `CODEWHALE_PROFILE` / `DEEPSEEK_PROFILE`，并拒绝 `--profile` 覆盖临时配置；不修改父进程环境。适配器不重试模型 POST；')
          replace('README.md', '已执行 36 项测试', '已执行 38 项测试')
          replace('README.md', 'npm run pack:check\n```', 'npm run pack:check\n# 官方原生宿主，只测试本地 OAuth 和模型目录，不调用生产推理\nLMM_CODEWHALE_BIN=/absolute/path/to/codewhale npm run test:host\n```')
          PY
      - name: Unit tests and package validation
        run: |
          npm run check
          npm test
          npm run pack:check
      - name: Install the official native host in isolation
        run: |
          npm install --prefix "$RUNNER_TEMP/codewhale-host" codewhale@latest
          HOST_ROOT="$RUNNER_TEMP/codewhale-host/node_modules/codewhale" node --input-type=commonjs -e 'require(process.env.HOST_ROOT + "/scripts/install.js").getBinaryPath("codewhale").then(p=>console.log("LMM_CODEWHALE_BIN="+p)).catch(e=>{console.error(e);process.exitCode=1})' >> "$GITHUB_ENV"
      - name: Verify current native host
        run: npm run test:host
      - name: Commit tested sources only to the upgrade branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json plugin.json README.md src/provider.mjs src/cli.mjs
          git commit -m 'fix: isolate Codewhale profiles and validate native catalog discovery'
          git push origin HEAD:refs/heads/chore/plugin-compat-20261006
